name: Template check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - id: template
        uses: tplAIter/tplaiter/.github/actions/template-check@10eb614eb9b0c8fb9bbd4e37c051e989ec6bed31
        with:
          generator-preflight: 'true'
      - name: Test every rendered Go fixture
        env:
          RENDER_ROOT: ${{ steps.template.outputs.render-root }}
        run: |
          set -euo pipefail
          for project in "$RENDER_ROOT"/*; do
            bash checks/verify-render.sh "$project"
          done
