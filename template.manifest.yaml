apiVersion: tplater.dev/v1alpha1
kind: Template
metadata:
  name: go-service
  version: 0.0.0-local
  description: Go service with explicit manual dependency injection, an entity generator and optional Temporal workflows.
  labels:
    tags: ["go", "service", "manual-di", "entity", "temporal", "сервис", "сущность"]
    lang: ["go"]
    framework: ["temporal"]
    candidate-kind: ["template"]
    readiness: ["unknown"]
    keywords: ["go", "service", "entity", "manual injection", "temporal", "workflow", "сервис", "сущность", "ручная инъекция", "воркфлоу"]
    use-cases: ["Create a Go service", "Add entity", "Enable optional Temporal workflows", "Создать сервис Go", "Добавить сущность", "Добавить Temporal воркфлоу"]
engine:
  type: gotemplate
  root: files
settings:
  - group: workflow
    title: Background workflows
    type: toggle
    default: false

generators:
  - kind: entity
    description: Add a neutral entity vertical with manual dependency injection wiring.
    targets:
      - snippet: generators/entity/types.go.tmpl
        target: internal/{{ .Name.Snake }}/types.go
      - snippet: generators/entity/controller.go.tmpl
        target: internal/{{ .Name.Snake }}/controller/controller.go
      - snippet: generators/entity/service.go.tmpl
        target: internal/{{ .Name.Snake }}/service/service.go
      - snippet: generators/entity/repository.go.tmpl
        target: internal/{{ .Name.Snake }}/repository/repository.go
      - snippet: generators/entity/assembly.go.tmpl
        target: cmd/service/{{ .Name.Snake }}.go
    anchors:
      - file: cmd/service/main.go
        anchor: "// CODEGEN:ENTITY_WIRING"
        insert: generators/entity/wiring.go.tmpl

commands:
  build:
    run: go build -mod=readonly -buildvcs=false ./...
    description: Compile authenticated current Go inputs with an approved offline module closure
